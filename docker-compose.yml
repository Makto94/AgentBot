# Limita i log json-file di docker: senza tetto un container loquace ruota
# via la cronologia utile (successo nel busy-loop del bot, 153k righe/48h).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    # TimescaleDB extension on Postgres 16 — drop-in replacement for postgres:16
    # con compressione columnar nativa per hypertable time-series.
    image: timescale/timescaledb:latest-pg16
    container_name: stock_scanner_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner} -d ${POSTGRES_DB:-stock_scanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    logging: *default-logging
    build: .
    container_name: stock_scanner_bot
    restart: always
    env_file: .env
    # yfinance apre una connessione SQLite alla cache timezone (tkr-tz.db) per
    # ticker; con lo scan multi-thread su ~2800 simboli i fd si accumulano e
    # saturano il default di 1024, rompendo socket Telegram e download Yahoo
    # ([Errno 24] Too many open files). Alziamo il tetto.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Rome
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scanner-network
    # Verifica passiva di vita: il log deve essere stato scritto negli ultimi
    # 60 minuti. Una scansione silenziosamente bloccata viene marcata unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $(find /tmp/alerts.log -mmin -60 2>/dev/null | wc -l) -eq 1"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 2m

  web-backend:
    logging: *default-logging
    build: ./web/backend
    container_name: stock_scanner_backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web-frontend:
    logging: *default-logging
    build: ./web/frontend
    container_name: stock_scanner_frontend
    restart: always
    ports:
      - "7071:80"
    networks:
      - scanner-network
      - nginx-proxy-manager_default
    depends_on:
      - web-backend

volumes:
  pgdata:

networks:
  scanner-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
  nginx-proxy-manager_default:
    external: true
